<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lvsync</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="lvsync">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_back,refresh,terminal,videocam" />
</head>
<body>
  <div id="header">
    <div id="header-row">
      <h2>lvsync</h2>
      <span id="log-btn" class="material-symbols-outlined">terminal</span>
    </div>
    <div id="week-nav">
      <span id="week-label"></span>
    </div>
  </div>
  <div id="log-view" class="hidden">
    <div id="log-header">
      <span id="log-back" class="material-symbols-outlined">arrow_back</span>
      <h2>sync log</h2>
      <span id="log-refresh" class="material-symbols-outlined">refresh</span>
    </div>
    <div id="log-list"></div>
    <div id="log-footer">
      <label id="theme-toggle">
        <span>light mode</span>
        <input type="checkbox" id="theme-switch">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </label>
    </div>
  </div>
  <div id="slide-wrap">
    <div id="track">
      <div id="out-prev"></div>
      <div id="out-curr"></div>
      <div id="out-next"></div>
    </div>
  </div>
  <div id="detail-modal">
    <div class="detail-content">
      <div class="detail-title"></div>
      <div class="detail-class"></div>
      <div class="detail-lecturer"></div>
      <div class="detail-date"></div>
      <div class="detail-time"></div>
      <div class="detail-location"></div>
      <button class="detail-delete" style="display:none">termin löschen</button>
    </div>
  </div>
  <div id="add-modal">
    <div class="add-content">
      <div class="add-header">neuer termin</div>
      <input id="add-title" type="text" placeholder="titel" autocomplete="off">
      <input id="add-location" type="text" placeholder="ort (optional)" autocomplete="off">
      <div class="add-slots">
        <label>von<input type="text" id="add-start-time" placeholder="HH:MM" inputmode="numeric"></label>
        <label>bis<input type="text" id="add-end-time" placeholder="HH:MM" inputmode="numeric"></label>
      </div>
      <div class="add-date-display"></div>
      <div class="add-actions">
        <button class="add-cancel">abbrechen</button>
        <button class="add-save">speichern</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
